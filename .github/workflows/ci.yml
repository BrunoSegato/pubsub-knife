name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Lint
        run: make check

      # mesmo emulador do ambiente local; --wait aguarda o healthcheck
      - name: Start Pub/Sub Emulator
        run: docker compose up -d --wait

      - name: Run Tests
        run: make test-ci
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085

      - name: Emulator logs
        if: failure()
        run: docker compose logs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
